<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="btnAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bgGrad)" rx="12" />
  
  <!-- Calculator Mockup Card -->
  <rect x="150" y="25" width="300" height="300" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Screen -->
  <rect x="170" y="45" width="260" height="60" rx="8" fill="#0f172a" stroke="#334155" />
  <text x="415" y="65" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">sin(30°) + 25 × 4</text>
  <text x="415" y="93" font-family="monospace" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="end">100.5</text>
  
  <!-- Keypad Preview -->
  <g transform="translate(170, 120)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="58" height="35" rx="6" fill="#ef4444" opacity="0.85" />
    <text x="29" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">AC</text>
    
    <rect x="67" y="0" width="58" height="35" rx="6" fill="#334155" />
    <text x="96" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">( )</text>
    
    <rect x="134" y="0" width="58" height="35" rx="6" fill="#334155" />
    <text x="163" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">%</text>
    
    <rect x="201" y="0" width="58" height="35" rx="6" fill="#f59e0b" />
    <text x="230" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">÷</text>

    <!-- Row 2 -->
    <rect x="0" y="44" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="29" y="66" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">7</text>
    <rect x="67" y="44" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="96" y="66" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">8</text>
    <rect x="134" y="44" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="163" y="66" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">9</text>
    <rect x="201" y="44" width="58" height="35" rx="6" fill="#f59e0b" />
    <text x="230" y="66" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">×</text>

    <!-- Row 3 -->
    <rect x="0" y="88" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="29" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">4</text>
    <rect x="67" y="88" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="96" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">5</text>
    <rect x="134" y="88" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="163" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">6</text>
    <rect x="201" y="88" width="58" height="35" rx="6" fill="#f59e0b" />
    <text x="230" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">−</text>

    <!-- Row 4 -->
    <rect x="0" y="132" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="29" y="154" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">1</text>
    <rect x="67" y="132" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="96" y="154" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">2</text>
    <rect x="134" y="132" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="163" y="154" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">3</text>
    <rect x="201" y="132" width="58" height="35" rx="6" fill="#f59e0b" />
    <text x="230" y="154" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">+</text>

    <!-- Row 5 -->
    <rect x="0" y="176" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="29" y="198" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">0</text>
    <rect x="67" y="176" width="58" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="96" y="198" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">.</text>
    <rect x="134" y="176" width="125" height="35" rx="6" fill="url(#btnAccent)" />
    <text x="196" y="198" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">=</text>
  </g>
</svg>

